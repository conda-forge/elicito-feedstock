{% set name = "elicito" %}
{% set version = "0.8.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/elicito-{{ version }}.tar.gz
  sha256: db990eaf00e04aabbec7ef0f11f9b80ec27d86179e4b841171863eb4ee4e4c70

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >={{ python_min }},<3.14
    - __unix
    - cma >=3.4.0
    - joblib >=1.4.2
    - numpy >=1.24
    - rich >=13.0
    - tensorflow >=2.16.0
    - tensorflow-probability >=0.24.0
    - tf-keras >=2.16.0
    - xarray >=2025.9.0

test:
  imports:
    - elicito
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://elicito.readthedocs.io
  summary: A Python package for learning prior distributions based on expert knowledge
  license: Apache-2.0
  license_file: LICENCE
  doc_url: https://elicito.readthedocs.io
  dev_url: https://github.com/florence-bockting/elicito

extra:
  recipe-maintainers:
    - florence-bockting
